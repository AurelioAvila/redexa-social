name = "social-dashboard-oauth"
main = "worker.js"
compatibility_date = "2026-08-04"

# L'intera app (scambio OAuth, checkout, verifica licenza) chiama
# OAUTH_PROXY_URL in brand.py, che punta qui: se questo viene disattivato,
# ogni utente installato smette di poter collegare account, pagare o
# verificare la licenza. Wrangler lo disattiva di default appena c'e' un
# dominio personalizzato nel file, quindi va tenuto esplicito.
workers_dev = true

# I segreti NON vanno scritti qui: questo file finisce nel repository.
# Si caricano con `wrangler secret put NOME`, vedi README.md.
#   INSTAGRAM_APP_ID
#   INSTAGRAM_APP_SECRET
#   TIKTOK_CLIENT_KEY
#   TIKTOK_CLIENT_SECRET
#   STRIPE_SECRET_KEY       (crea le sessioni di pagamento)
#   STRIPE_WEBHOOK_SECRET   (verifica che il pagamento arrivi davvero da Stripe)
#   RESEND_API_KEY          (manda la chiave di licenza via email)

# URL pubblico del Worker: serve a costruire i link di ritorno dopo il
# pagamento. Non e' un segreto, quindi puo' stare qui.
[vars]
PUBLIC_URL = "https://social-dashboard-oauth.canadesino91.workers.dev"

# Dove vivono le licenze emesse. Il piano gratuito di Cloudflare basta
# ampiamente: una verifica per avvio dell'app, non per richiesta.
[[kv_namespaces]]
binding = "LICENSES"
id = "af2c5861028c4120a372c8ad0ce25a1a"

# Dominio proprio per le pagine di branding (home/privacy/terms): la
# verifica del branding OAuth di Google non riesce a confermare la
# proprieta' di un sottodominio condiviso come *.github.io. Richiede che
# la zona getcertsprint.com sia nello stesso account Cloudflare.
[[routes]]
pattern = "socialdashboard.getcertsprint.com"
custom_domain = true
