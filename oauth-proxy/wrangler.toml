name = "social-dashboard-oauth"
main = "worker.js"
compatibility_date = "2026-08-04"

# The entire application (OAuth exchange, checkout, and license verification)
# calls OAUTH_PROXY_URL in brand.py. Keep workers.dev explicitly enabled:
# Wrangler disables it by default when a custom domain is configured.
workers_dev = true

# Never write secrets here because this file is committed to the repository.
# Upload them with `wrangler secret put NAME`; see README.md.
#   INSTAGRAM_APP_ID
#   INSTAGRAM_APP_SECRET
#   TIKTOK_CLIENT_KEY
#   TIKTOK_CLIENT_SECRET
#   STRIPE_SECRET_KEY       (creates payment sessions)
#   STRIPE_WEBHOOK_SECRET   (verifies that payment events came from Stripe)
#   RESEND_API_KEY          (delivers license keys by email)

# Public Worker URL used to build post-payment return links. It is not secret.
[vars]
PUBLIC_URL = "https://social-dashboard-oauth.canadesino91.workers.dev"

# Issued licenses live here. The application verifies once per launch.
[[kv_namespaces]]
binding = "LICENSES"
id = "af2c5861028c4120a372c8ad0ce25a1a"

# Custom domain for branding pages (home, privacy, and terms). Google OAuth
# cannot verify ownership of a shared subdomain such as *.github.io. The
# getcertsprint.com zone must belong to the same Cloudflare account.
[[routes]]
pattern = "socialdashboard.getcertsprint.com"
custom_domain = true
