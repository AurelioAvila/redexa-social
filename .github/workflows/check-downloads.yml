name: Verify public signed download
on:
  push:
    branches: [releases]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.0
      - name: Verify the current public archive and signed manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE="Redexa-Social-${TAG}-win64.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PACKAGE" --pattern latest.json
          python scripts/verify_release.py --package "$PACKAGE" --manifest latest.json --version "${TAG#v}"
