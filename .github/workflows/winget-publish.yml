name: Publish to winget

# Every submission so far has been manual, and every one of them was closed
# without merging — eight attempts across versions 1.2.1 through 1.6.0. The
# errors in the early ones (a 63-character hash, a wrong asset URL) were
# manual-transcription mistakes; the later ones just got superseded by the
# next patch while still waiting for review. winget-releaser generates the
# manifest from the release itself, so there is nothing left to transcribe.
#
# This package ships a .zip with the executable nested inside (portable,
# not a bare .exe/.msi), which is why installers-regex is overridden below —
# the default pattern does not match archives at all.
#
# "released" rather than "published": winget-releaser's own recommendation,
# and it excludes pre-releases specifically — a beta build has no business
# reaching winget's index.
#
# The `release` trigger above cannot fire on its own here: the release is
# created by softprops/action-gh-release using GITHUB_TOKEN, and GitHub
# deliberately raises no workflow-triggering events for anything that token
# does - which is why this workflow had never run once since it was added.
# The Release workflow therefore calls it directly (workflow_call), and the
# release trigger stays only for releases published by hand from the web UI.
on:
  release:
    types: [released]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to submit"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to submit (defaults to latest)"
        required: false

# The job never pushes to this repository — only to a fork of winget-pkgs,
# authenticated by the PAT in WINGET_TOKEN below, which is a separate
# credential from anything GITHUB_TOKEN could grant here.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Same shape as the other three products' copy of this workflow: a
      # missing secret skips the job with a visible warning rather than
      # failing the run red. The PAT is a personal credential tied to a
      # GitHub account, not something a workflow can generate for itself.
      - name: Check for the winget PAT
        id: gate
        run: |
          if [ -z "${{ secrets.WINGET_TOKEN }}" ]; then
            echo "::warning::WINGET_TOKEN secret is not set; skipping the winget submission"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # This step used to carry `continue-on-error: true`. The reason was
      # real at the time - a package is not in the index until a moderator
      # approves the first submission, and until then the action stops with
      # "package does not exist", which should not have painted a successful
      # release red.
      #
      # It also hid the next two releases. 1.7.4 and 1.7.5 both reported this
      # job green while submitting nothing: the action was still failing with
      # "does not exist", not because the package was awaiting approval - it
      # had been in winget since 1.7.3 - but because the check reads the
      # *fork*, and the fork was 342 commits behind and had never received
      # the manifest. So winget served 1.7.3 while the release page served
      # 1.7.5, and every signal anybody looks at was green.
      #
      # The window that justified swallowing the error has closed: the
      # package is in the index. A submission that fails now is a submission
      # that did not happen, and it should say so. The release artifacts are
      # already published by this point - this job only gates the index
      # entry, so a red run here costs a notification, not a release.
      - if: steps.gate.outputs.skip != 'true'
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: AurelioAvila.SocialDashboard
          installers-regex: '-win64\.zip$'
          # On a release event `inputs.tag` is empty, and the action then
          # asks GitHub for the release at `/releases/tags/` — a 404 that
          # fails the job before Komac ever runs. The event carries the tag
          # already, so fall back to it and keep the manual input as an
          # override for re-submitting an older release.
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
