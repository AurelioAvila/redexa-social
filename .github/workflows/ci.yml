name: Tests
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Use the public test configuration
        run: Copy-Item brand.example.py brand.py
      - name: Test application and release gates
        run: python -m pytest
      - name: Test publisher and timestamp policy
        run: ./scripts/test_authenticode.ps1
      - name: Test public pages and OAuth routes
        run: node --test oauth-proxy/*.test.mjs
