name: Sign locally built release manifest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
      sha256:
        description: SHA256 of the Authenticode-signed ZIP
        required: true
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install cryptography==50.0.0
      - name: Verify package and sign manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_HASH: ${{ inputs.sha256 }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_HASH" =~ ^[a-fA-F0-9]{64}$ ]]
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true
          PACKAGE="Redexa-Social-${TAG}-win64.zip"
          gh release download "$TAG" --repo "$REPO" --pattern "$PACKAGE"
          printf '%s  %s\n' "$EXPECTED_HASH" "$PACKAGE" | sha256sum --check
          python scripts/make_manifest.py --package "$PACKAGE" --version "${TAG#v}" --download-url "https://github.com/$REPO/releases/download/$TAG/$PACKAGE" --release-notes-url "https://github.com/$REPO/releases/tag/$TAG" --out latest.json
          python -c 'import json; from updater.signature import verify, PUBLIC_KEY_B64; verify(json.load(open("latest.json")), PUBLIC_KEY_B64)'
          gh release upload "$TAG" latest.json --repo "$REPO"
