name: Sign locally built release manifest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
      sha256:
        description: SHA256 of the Authenticode-signed download ZIP (-win64.zip)
        required: true
      update_sha256:
        description: SHA256 of the Authenticode-signed update ZIP (-update.zip)
        required: true
permissions:
  contents: read
jobs:
  manifest:
    if: github.actor == 'AurelioAvila'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update package installer
        run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install cryptography==50.0.0
      - name: Verify package and sign manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EXPECTED_HASH: ${{ inputs.sha256 }}
          EXPECTED_UPDATE_HASH: ${{ inputs.update_sha256 }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_HASH" =~ ^[a-fA-F0-9]{64}$ ]]
          [[ "$EXPECTED_UPDATE_HASH" =~ ^[a-fA-F0-9]{64}$ ]]
          test "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = true
          # Two archives of one signed build: the download, and the update
          # archive that also carries the legacy launcher installations older
          # than the rename restart. See scripts/verify_release.py.
          PACKAGE="Redexa-Social-${TAG}-win64.zip"
          UPDATE="Redexa-Social-${TAG}-update.zip"
          gh release download "$TAG" --repo "$REPO" --pattern "$PACKAGE" --pattern "$UPDATE"
          printf '%s  %s\n%s  %s\n' "$EXPECTED_HASH" "$PACKAGE" "$EXPECTED_UPDATE_HASH" "$UPDATE" | sha256sum --check
          python scripts/verify_release.py --package "$PACKAGE" --version "${TAG#v}"
          python scripts/verify_release.py --package "$UPDATE" --version "${TAG#v}"
          python scripts/make_manifest.py --package "$UPDATE" --version "${TAG#v}" --download-url "https://github.com/$REPO/releases/download/$TAG/$UPDATE" --public-package "$PACKAGE" --public-url "https://github.com/$REPO/releases/download/$TAG/$PACKAGE" --release-notes-url "https://github.com/$REPO/releases/tag/$TAG" --out latest.json
          python scripts/verify_release.py --package "$PACKAGE" --manifest latest.json --version "${TAG#v}"
          python scripts/verify_release.py --package "$UPDATE" --manifest latest.json --version "${TAG#v}"
          gh release upload "$TAG" latest.json --repo "$REPO"
