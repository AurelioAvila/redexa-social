# Publish a release: test, build, sign the update manifest, and upload artifacts.
name: Release

# A tag anchors every release to an exact point in history.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        default: stable
        type: choice
        options: [stable, beta]

# Tests and third-party actions start read-only. Only the release job receives
# write access, and only because it creates a GitHub Release.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # brand.py never lives in the repo (see .gitignore) - it holds the
      # product's OAuth proxy URL, which check_release.py verifies is set
      # so the build doesn't ship with client secrets embedded. Without this
      # step every run fails at the "import brand" line, before it even
      # gets to check what's inside.
      - name: Write brand.py from secret
        shell: bash
        env:
          BRAND_PY: ${{ secrets.BRAND_PY }}
        run: printf '%s' "$BRAND_PY" > brand.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Confirm source contains no secrets
        run: python check_release.py

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Without this the build would ship with no proxy configured: broken
      # Instagram and TikTok OAuth for everyone who downloads the release, not
      # merely a check that fails. See the same step in the "test" job.
      - name: Write brand.py from secret
        shell: bash
        env:
          BRAND_PY: ${{ secrets.BRAND_PY }}
        run: printf '%s' "$BRAND_PY" > brand.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          # The tag and APP_VERSION must match. Otherwise, the updater would
          # install a package that reports a different version.
          DECLARED=$(python -c "import version; print(version.APP_VERSION)")
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Tag version is $VERSION but APP_VERSION is $DECLARED"
            exit 1
          fi

      - name: Build updater
        run: pyinstaller updater.spec --noconfirm

      - name: Build application
        run: |
          pyinstaller "Redexa Social.spec" --noconfirm
          pyinstaller legacy_launcher.py --onefile --noconsole --name "Social Dashboard" --icon icon.ico --noconfirm

      - name: Bundle updater with application
        run: |
          copy "dist\updater.exe" "dist\Redexa Social\updater.exe"
          copy "dist\Social Dashboard.exe" "dist\Redexa Social\Social Dashboard.exe"

      - name: Confirm build contains no credentials
        run: python check_release.py --dist

      - name: Create package
        id: package
        shell: bash
        run: |
          PACKAGE_NAME="Redexa-Social-v${{ steps.version.outputs.value }}-win64.zip"
          powershell -Command "Compress-Archive -Path 'dist/Redexa Social/*' -DestinationPath '$PACKAGE_NAME' -CompressionLevel Optimal"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"

      - name: Build and sign update manifest
        id: manifest
        env:
          # Keep the private key in the environment, never in a command-line argument.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        shell: bash
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            # Until the key is provisioned, publish without in-app updates
            # instead of blocking the complete release.
            echo "::warning::UPDATE_SIGNING_KEY is not configured; publishing without an in-app update manifest"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUTPUT="latest.json"
          [ "$RELEASE_CHANNEL" = "beta" ] && OUTPUT="beta.json"
          python scripts/make_manifest.py \
            --package "${{ steps.package.outputs.name }}" \
            --version "${{ steps.version.outputs.value }}" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.name }}" \
            --channel "$RELEASE_CHANNEL" \
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --out "$OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the signed manifest
        if: steps.manifest.outputs.signed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import json
          from updater import signature

          for path in glob.glob("*.json"):
              if path in ("latest.json", "beta.json"):
                  with open(path, encoding="utf-8") as manifest_file:
                      manifest = json.load(manifest_file)
                  signature.verify(manifest, signature.PUBLIC_KEY_B64)
                  print(f"{path}: signature verified with the application's public key")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
            latest.json
            beta.json
          fail_on_unmatched_files: false
          generate_release_notes: true

  # Submitting to winget is part of publishing, not a separate errand to
  # remember: the package index should never be a version behind the release
  # page. Only for stable tags - a beta build has no business on winget.
  winget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.channel || 'stable') == 'stable'
    uses: ./.github/workflows/winget-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
