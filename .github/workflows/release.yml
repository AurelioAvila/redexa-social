# Release only after publisher, timestamp and updater verification succeeds.
name: Release

# A tag anchors every release to an exact point in history.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        default: stable
        type: choice
        options: [stable, beta]

# Tests and third-party actions start read-only. Only the release job receives
# write access, and only because it creates a GitHub Release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Without this the build would ship with no proxy configured: broken
      # Instagram and TikTok OAuth for everyone who downloads the release, not
      # merely a check that fails. Tests use only the public example template.
      - name: Write brand.py from secret
        shell: bash
        env:
          BRAND_PY: ${{ secrets.BRAND_PY }}
        run: printf '%s' "$BRAND_PY" > brand.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Confirm release configuration
        run: python check_release.py

      - name: Require the existing updater signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) {
            throw 'UPDATE_SIGNING_KEY is required; distribution is blocked.'
          }

      - name: Read version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release version"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          # The tag and APP_VERSION must match. Otherwise, the updater would
          # install a package that reports a different version.
          DECLARED=$(python -c "import version; print(version.APP_VERSION)")
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Tag version is $VERSION but APP_VERSION is $DECLARED"
            exit 1
          fi

      - name: Build updater
        run: pyinstaller updater.spec --noconfirm

      - name: Build application
        run: |
          pyinstaller "Redexa Social.spec" --noconfirm
          pyinstaller legacy_launcher.py --onefile --noconsole --name "Social Dashboard" --icon icon.ico --noconfirm

      - name: Bundle updater with application
        run: |
          copy "dist\updater.exe" "dist\Redexa Social\updater.exe"
          copy "dist\Social Dashboard.exe" "dist\Redexa Social\Social Dashboard.exe"

      - name: Confirm build contains no credentials
        run: python check_release.py --dist

      # No publisher signing provider is configured in this repository.
      # Until that integration is provisioned, hosted builds MUST stop here.
      # A local signing session may use the draft-manifest workflow instead;
      # it enforces the same final-package checks. See RELEASE-SAFETY.md.
      - name: Require publisher signatures and trusted timestamps
        run: ./scripts/verify_authenticode.ps1 -Directory 'dist/Redexa Social'

      - name: Create package
        id: package
        shell: bash
        run: |
          PACKAGE_NAME="Redexa-Social-v${{ steps.version.outputs.value }}-win64.zip"
          powershell -Command "Compress-Archive -Path 'dist/Redexa Social/*' -DestinationPath '$PACKAGE_NAME' -CompressionLevel Optimal"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$PACKAGE_NAME" > "$PACKAGE_NAME.sha256"

      - name: Build and sign update manifest
        id: manifest
        env:
          # Keep the private key in the environment, never in a command-line argument.
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        shell: bash
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is required; distribution is blocked"
            exit 1
          fi
          OUTPUT="latest.json"
          [ "$RELEASE_CHANNEL" = "beta" ] && OUTPUT="beta.json"
          python scripts/make_manifest.py \
            --package "${{ steps.package.outputs.name }}" \
            --version "${{ steps.version.outputs.value }}" \
            --download-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.package.outputs.name }}" \
            --channel "$RELEASE_CHANNEL" \
            --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
            --out "$OUTPUT"
          echo "name=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Verify final package and required updater manifest
        run: >-
          python scripts/verify_release.py
          --package "${{ steps.package.outputs.name }}"
          --manifest "${{ steps.manifest.outputs.name }}"
          --version "${{ steps.version.outputs.value }}"
          --channel "${{ github.event.inputs.channel || 'stable' }}"

      - name: Refuse to reuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests
          response = requests.get(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['GITHUB_REF_NAME']}",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]}, timeout=30)
          if response.status_code != 404:
              raise SystemExit("A new release is required; existing or unreadable release state blocks publication.")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
            ${{ steps.manifest.outputs.name }}
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          prerelease: ${{ (github.event.inputs.channel || 'stable') == 'beta' }}

  # Submitting to winget is part of publishing, not a separate errand to
  # remember: the package index should never be a version behind the release
  # page. Only for stable tags - a beta build has no business on winget.
  winget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event.inputs.channel || 'stable') == 'stable'
    uses: ./.github/workflows/winget-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
